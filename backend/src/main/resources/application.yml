server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  application:
    name: park-ticket
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  cors:
    # 前端单独起在 Vite 5173（开发）或 4173（preview）。浏览器会带 Origin，未列出的源会被拒绝。
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:4173
      - http://127.0.0.1:4173

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
